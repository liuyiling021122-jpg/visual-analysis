<div class="toolbar" data-window="top-toolbar">
  <div class="toolbar-title-group">
    <span class="eyebrow">Migration Beekeeping Visual Analysis</span>
    <h1 class="display-title">追花为生</h1>
    <p class="placeholder-copy">中国流动养蜂人的迁徙、授粉与生计风险可视分析系统</p>
  </div>

  <div class="toolbar-controls" aria-label="年代切换">
    <span class="caption">年代</span>
    <div class="segmented-control">
      <button type="button" aria-pressed="false" data-era="1980s">1980s</button>
      <button type="button" aria-pressed="false" data-era="2000s">2000s</button>
      <button type="button" aria-pressed="true" data-era="2020s">2020s</button>
    </div>
  </div>

  <div class="toolbar-controls" aria-label="月份窗口">
    <span class="caption">时间窗口</span>
    <div class="segmented-control">
      <button type="button" aria-pressed="true" data-month-window="all">全年路线</button>
      <button type="button" aria-pressed="false" data-month-window="spring">春花期</button>
      <button type="button" aria-pressed="false" data-month-window="summer">夏蜜源</button>
    </div>
  </div>
</div>
