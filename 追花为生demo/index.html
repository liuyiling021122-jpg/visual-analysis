<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>花期节律主视图 | 追花为生</title>
    <link rel="stylesheet" href="css/design-tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/visualization-placeholders.css" />
    <link rel="stylesheet" href="css/flowering-rhythm.css" />
  </head>
  <body class="flowering-page">
    <div class="app-shell flowering-shell">
      <header class="app-region app-region-top flowering-system-header">
        <h1 class="display-title">追花为生</h1>
        <div class="flowering-system-identity">
          <span class="eyebrow">Migration Beekeeping Visual Analysis</span>
          <p class="placeholder-copy">中国流动养蜂人的迁徙、授粉与生计风险可视分析系统</p>
        </div>
      </header>

      <main class="app-grid flowering-grid" aria-label="花期节律分析页面">
        <section class="app-region app-region-main">
          <section class="panel flowering-main-panel" aria-label="迁徙花期主视图">
            <div class="panel-body flowering-main-body">
              <aside class="flowering-side-rail">
                <header class="flowering-main-header">
                  <span class="eyebrow">View 02 · Primary</span>
                  <h2 class="panel-title">路径节律主视图</h2>
                </header>

                <div class="flowering-control-strip">
                  <div class="layer-toggle-list flowering-layer-toggles" aria-label="信息层开关">
                    <button class="layer-toggle" type="button" aria-pressed="true" data-overlay-toggle="l1">L1 时间基线 <span class="layer-help-icon" data-layer-help="全年时间与地点迁徙弧线的基底结构。" aria-hidden="true">?</span></button>
                    <button class="layer-toggle" type="button" aria-pressed="true" data-overlay-toggle="l2">L2 停留时段 <span class="layer-help-icon" data-layer-help="每段迁徙在对应地点的停留起止时间。" aria-hidden="true">?</span></button>
                    <button class="layer-toggle" type="button" aria-pressed="true" data-overlay-toggle="l3">L3 天气窗口 <span class="layer-help-icon" data-layer-help="天气适宜窗口，标记 good_honey_day 对应日期。" aria-hidden="true">?</span></button>
                    <button class="layer-toggle" type="button" aria-pressed="true" data-overlay-toggle="l4">L4 花期强度 <span class="layer-help-icon" data-layer-help="蜜源植物花期的阶段与强度。" aria-hidden="true">?</span></button>
                    <button class="layer-toggle" type="button" aria-pressed="true" data-overlay-toggle="l5">L5 有效采蜜 <span class="layer-help-icon" data-layer-help="同时满足花期与天气条件的有效采蜜日期。" aria-hidden="true">?</span></button>
                    <button class="layer-toggle" type="button" aria-pressed="true" data-overlay-toggle="nwi">NWI 指数 <span class="layer-help-icon" data-layer-help="蜜源天气指数，数值越高越有利于泌蜜与采蜜。" aria-hidden="true">?</span></button>
                  </div>
                </div>

                <aside class="flowering-route-map-slot" data-component-slot="route-map-panel"></aside>
              </aside>

              <section class="flowering-visual-column">
                <div class="flowering-canvas-actions">
                  <div class="flowering-tools" aria-label="主视图工具">
                    <button type="button" class="compact-button" data-fit-view>适配</button>
                    <button type="button" class="compact-button" data-zoom-out aria-label="缩小">−</button>
                    <output data-zoom-label>100%</output>
                    <button type="button" class="compact-button" data-zoom-in aria-label="放大">＋</button>
                  </div>
                  <label class="opacity-control">
                    <span>L4 强度</span>
                    <input type="range" min="20" max="100" value="100" data-opacity />
                  </label>
                </div>

                <div class="flowering-canvas-frame">
                  <div class="flowering-canvas-shell" data-canvas-shell>
                    <div class="flowering-canvas" data-flowering-canvas>
                    <img class="rhythm-layer rhythm-layer-base" src="assets/flowering-rhythm/L0-base.svg" alt="全年时间分段与地点轨道基底" data-l1-layer />
                    <svg class="lane-highlight-layer" viewBox="-140 -160 1422 1452" aria-hidden="true" data-lane-highlight-layer></svg>
                    <div class="rhythm-layer rhythm-layer-flowering" role="img" aria-label="东线沿海线 L4 花期强度图层" data-flowering-layer></div>
                    <svg class="lane-active-flowering-layer" viewBox="-140 -160 1422 1452" aria-hidden="true" data-lane-active-flowering-layer></svg>
                    <svg class="rhythm-annotation-layer" viewBox="-140 -160 1422 1452" aria-label="路径节律信息标注层" data-annotation-layer></svg>
                    <div class="segment-index" data-segment-index aria-label="东线迁徙段索引"></div>
                    </div>
                  </div>
                  <button type="button" class="compact-button lane-focus-back" data-lane-focus-back hidden>Back</button>
                </div>

                <div class="flowering-legend" aria-label="花期图例">
                  <span><i class="viz-key key-l1"></i>L1 时间基线</span>
                  <span><i class="viz-key key-l2"></i>L2 停留时段</span>
                  <span><i class="viz-key key-l3"></i>L3 天气窗口</span>
                  <span><i class="viz-key key-l4"></i>L4 花期强度</span>
                  <span><i class="viz-key key-l5"></i>L5 有效采蜜</span>
                  <span><i class="viz-key key-nwi"></i>NWI 指数</span>
                </div>
              </section>
            </div>
          </section>
        </section>

        <aside class="app-region app-region-right flowering-auxiliary-region" data-component-slot="livelihood-risk-panel"></aside>
      </main>
    </div>

    <div class="floating-layer" data-component-slot="tooltip-layer"></div>
    <div class="rhythm-tooltip" data-rhythm-tooltip hidden></div>
    <script type="module" src="js/flowering-rhythm.js"></script>
  </body>
</html>
