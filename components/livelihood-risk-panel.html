<section class="panel" data-window="livelihood-risk-panel" aria-label="生计风险解读面板">
  <header class="panel-header">
    <div>
      <span class="eyebrow">View 03</span>
      <h2 class="panel-title">生计风险解读面板</h2>
    </div>
    <button class="panel-action" type="button" aria-label="折叠风险面板">⌁</button>
  </header>

  <div class="panel-body panel-stack">
    <article class="info-card data-card route-risk-focus" data-route-risk-focus>
      <header class="data-card-header">
        <div>
          <h3 class="section-title">当前路线风险解释</h3>
          <p class="caption">随路线、年代与节点选择联动</p>
        </div>
      </header>
      <div class="panel-loading">路线风险摘要载入中...</div>
    </article>

    <section class="livelihood-summary" data-livelihood-kpis aria-label="蜂业核心指标">
      <div class="panel-loading">蜂业指标载入中...</div>
    </section>

    <article class="info-card data-card">
      <header class="data-card-header">
        <div>
          <h3 class="section-title">四种养殖模式单箱利润</h3>
          <p class="caption">2005-2025，单位：元/箱</p>
        </div>
      </header>
      <div class="chart-canvas" data-profit-trend></div>
      <div class="chart-legend" data-profit-legend></div>
    </article>

    <article class="info-card data-card">
      <header class="data-card-header">
        <div>
          <h3 class="section-title">最新年份模式对比</h3>
          <p class="caption">按单箱利润比较不同养殖模式</p>
        </div>
      </header>
      <div class="chart-canvas compact" data-mode-comparison></div>
    </article>

    <article class="info-card data-card">
      <header class="data-card-header">
        <div>
          <h3 class="section-title">蜂农成本结构</h3>
          <p class="caption">以最新财务年份拆分饲喂、运输、蜂药等成本</p>
        </div>
      </header>
      <div class="chart-canvas compact" data-cost-structure></div>
    </article>

    <article class="info-card data-card">
      <header class="data-card-header">
        <div>
          <h3 class="section-title">收入构成与授粉占比</h3>
          <p class="caption">蜂蜜销售仍是主体，授粉服务逐年成为补充收入</p>
        </div>
      </header>
      <div class="chart-canvas compact" data-income-composition></div>
    </article>

    <article class="info-card data-card">
      <header class="data-card-header">
        <div>
          <h3 class="section-title">农药使用强度参考</h3>
          <p class="caption">国家级年度数据，仅作为生计风险背景层</p>
        </div>
      </header>
      <div class="chart-canvas compact" data-pesticide-reference></div>
    </article>

    <article class="info-card data-card">
      <header class="data-card-header">
        <div>
          <h3 class="section-title">数据边界说明</h3>
          <p class="caption">避免把参考数据误读为精确路线风险</p>
        </div>
      </header>
      <div class="data-caveat-list" data-risk-caveats></div>
    </article>
  </div>
</section>
