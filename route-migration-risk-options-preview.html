<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>路线迁徙与沿途风险 · 三方案预览</title>
    <link rel="stylesheet" href="css/design-tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
      .preview-placeholder {
        display: grid;
        place-items: center;
        height: 100%;
        min-height: 0;
        background:
          linear-gradient(rgba(214, 208, 199, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(214, 208, 199, 0.12) 1px, transparent 1px),
          rgba(249, 248, 244, 0.52);
        background-size: 28px 28px;
      }

      .preview-placeholder::after {
        content: "占位区域 · 仅预览右侧路线风险面板";
        width: min(72%, 420px);
        padding: 28px 18px;
        color: var(--text-faint);
        border: 1px dashed var(--line-normal);
        border-radius: var(--radius-md);
        font-size: var(--font-caption);
        text-align: center;
      }

      .preview-risk-panel .panel-body { overflow: hidden; }
      .preview-risk-panel .risk-tab-list button:not(.is-active) { opacity: 0.46; cursor: default; }

      .scheme-shell {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        height: 100%;
        min-height: 0;
      }

      .scheme-stage {
        min-height: 0;
        padding: 10px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid var(--line-subtle);
        border-radius: var(--radius-sm);
      }

      .scheme-panel {
        display: grid;
        align-content: start;
        gap: 9px;
        height: 100%;
        min-height: 0;
      }

      .scheme-heading {
        display: grid;
        gap: 3px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--line-subtle);
      }

      .scheme-heading-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .scheme-heading h3 { margin: 0; font-size: var(--font-title-md); }
      .scheme-heading p,
      .scheme-note { margin: 0; color: var(--text-muted); font-size: var(--font-caption); line-height: 1.45; }

      .scheme-badge {
        flex: 0 0 auto;
        padding: 3px 6px;
        color: #7f5539;
        background: rgba(243, 222, 194, 0.72);
        border-radius: var(--radius-round);
        font-size: 8px;
      }

      .current-route-focus {
        display: grid;
        gap: 8px;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--line-subtle);
      }

      .current-route-heading {
        display: grid;
        gap: 3px;
      }

      .current-route-heading h3 {
        margin: 0;
        font-size: var(--font-title-md);
        text-decoration: underline dotted rgba(125, 112, 98, 0.48);
        text-underline-offset: 3px;
      }

      .current-route-heading p {
        margin: 0;
        color: var(--text-muted);
        font-size: var(--font-caption);
      }

      .current-route-kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 4px;
      }

      .current-route-kpis span {
        min-height: 47px;
        min-width: 0;
        padding: 6px 5px;
        color: var(--text-muted);
        background: rgba(251, 250, 246, 0.76);
        border: 1px solid var(--line-subtle);
        border-radius: var(--radius-sm);
        font-size: var(--font-caption);
      }

      .current-route-kpis strong {
        display: block;
        margin-top: 3px;
        color: var(--text-primary);
        font-family: Georgia, serif;
        font-size: 15px;
      }

      .current-route-reading {
        margin: 0;
        color: var(--text-secondary);
        font-size: var(--font-body-sm);
        line-height: 1.45;
      }

      .route-summary {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 8px;
        padding: 7px 8px;
        color: var(--text-secondary);
        background: rgba(251, 250, 246, 0.76);
        border: 1px solid var(--line-subtle);
        border-radius: var(--radius-sm);
        font-size: 9px;
      }

      .route-summary strong { color: var(--text-primary); font-size: 10px; }
      .route-summary span:last-child { color: var(--semantic-risk); font-weight: 600; }

      .risk-chain-legend {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        color: var(--text-muted);
        font-size: 8px;
      }

      .risk-chain-legend span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .risk-chain-legend .value-key {
        display: grid;
        place-items: center;
        width: 18px;
        height: 18px;
        color: #fff;
        background: var(--semantic-risk);
        border-radius: 50%;
        font: 600 7px Georgia, serif;
      }

      .risk-chain-legend .color-key {
        width: 48px;
        height: 6px;
        background: linear-gradient(90deg, #8fae8e, #d9a06c, #a85442);
        border-radius: var(--radius-round);
      }

      .risk-chain {
        position: relative;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 25px 7px;
        padding: 7px 2px 3px;
      }

      .risk-chain-arrows {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .risk-chain-arrow {
        fill: none;
        stroke: var(--line-normal);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
      }

      .chain-node {
        position: relative;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 4px;
        min-width: 0;
        color: var(--text-secondary);
        font-size: 8px;
        text-align: center;
      }

      .chain-node:nth-of-type(1) { grid-area: 1 / 1; }
      .chain-node:nth-of-type(2) { grid-area: 1 / 2; }
      .chain-node:nth-of-type(3) { grid-area: 1 / 3; }
      .chain-node:nth-of-type(4) { grid-area: 1 / 4; }
      .chain-node:nth-of-type(5) { grid-area: 2 / 4; }
      .chain-node:nth-of-type(6) { grid-area: 2 / 3; }
      .chain-node:nth-of-type(7) { grid-area: 2 / 2; }
      .chain-node:nth-of-type(8) { grid-area: 2 / 1; }

      .chain-dot {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        color: #fff;
        border: 3px solid rgba(255,255,255,.9);
        border-radius: 50%;
        box-shadow: 0 0 0 1px var(--line-normal);
        font: 600 10px Georgia, serif;
      }

      .chain-node strong {
        display: grid;
        place-items: start center;
        width: 100%;
        min-height: 20px;
        overflow: hidden;
        color: var(--text-primary);
        font-size: 9px;
        line-height: 1.15;
        text-align: center;
      }
      .chain-node small { color: var(--text-muted); font-size: 8px; }

      .chain-insight {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 4px;
      }

      .chain-insight span {
        padding: 6px;
        color: var(--text-muted);
        background: rgba(251, 250, 246, 0.72);
        border-left: 2px solid var(--semantic-risk);
        font-size: 8px;
        line-height: 1.35;
      }

      [data-segment] { transition: opacity 150ms ease, filter 150ms ease, transform 150ms ease; }
      .scheme-stage.has-focus [data-segment]:not(.is-focus) { opacity: .2; filter: grayscale(.7); }
      [data-segment].is-focus { transform: translateY(-1px); }

      .preview-tooltip {
        position: fixed;
        z-index: 50;
        max-width: 230px;
        padding: 7px 9px;
        pointer-events: none;
        color: #fff;
        background: rgba(47,42,38,.94);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-tooltip);
        font-size: 10px;
        line-height: 1.5;
        white-space: pre-line;
      }

      @media (max-height: 820px) {
        .scheme-stage { padding: 8px; }
        .scheme-panel { gap: 6px; }
        .scheme-heading { padding-bottom: 4px; }
        .current-route-focus { gap: 5px; padding-bottom: 6px; }
        .current-route-kpis { gap: 4px; }
        .current-route-kpis span { min-height: 40px; padding: 5px 6px; }
        .route-summary { padding: 5px 7px; }
        .risk-chain { gap: 18px 5px; padding-top: 2px; }
        .chain-dot { width: 31px; height: 31px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-region app-region-top">
        <div class="toolbar">
          <div class="toolbar-title-group">
            <span class="eyebrow">Migration Beekeeping Visual Analysis</span>
            <h1 class="display-title">追花为生</h1>
            <p class="placeholder-copy">中国流动养蜂人的迁徙、授粉与生计风险可视分析系统</p>
          </div>
          <div class="toolbar-controls"><span class="caption">年代</span><div class="segmented-control"><button>1980s</button><button>2000s</button><button aria-pressed="true">2020s</button></div></div>
          <div class="toolbar-controls"><span class="caption">时间窗口</span><div class="segmented-control"><button aria-pressed="true">全年路线</button><button>春花期</button><button>夏蜜源</button></div></div>
        </div>
      </header>

      <main class="app-grid">
        <aside class="app-region app-region-left"><section class="panel"><header class="panel-header"><div><span class="eyebrow">View 01</span><h2 class="panel-title">路线地图选择器</h2></div><button class="panel-action">◎</button></header><div class="panel-body preview-placeholder"></div></section></aside>
        <section class="app-region app-region-main"><section class="panel"><header class="panel-header"><div><span class="eyebrow">View 02 · Primary</span><h2 class="panel-title">路径节律主视图</h2><p class="placeholder-copy">时间轴 × 纬度轴的五层窗口线束</p></div></header><div class="panel-body preview-placeholder"></div></section></section>

        <aside class="app-region app-region-right">
          <section class="panel preview-risk-panel" aria-label="生计风险解读面板">
            <header class="panel-header"><div><span class="eyebrow">View 03</span><h2 class="panel-title">生计风险解读面板</h2></div><button class="panel-action">⌁</button></header>
            <nav class="risk-tab-list" aria-label="生计风险解读主题切换"><button class="is-active">路线迁徙与沿途风险</button><button disabled>蜂农生计与经营收益</button><button disabled>全国蜂业规模与市场环境</button></nav>
            <div class="panel-body">
              <div class="scheme-shell">
                <div class="scheme-stage" data-scheme-stage></div>
              </div>
            </div>
          </section>
        </aside>
      </main>
    </div>
    <div class="preview-tooltip" data-tooltip hidden></div>

    <script>
      const segments = [
        { id:1, from:'福建', to:'广东', start:[12,2], end:[12,12], days:10, km:450, cumulative:450, nectar:'越冬繁殖/荔枝', risk:0, honey:1, bad:0, nwi:85.36 },
        { id:2, from:'浙江', to:'安徽', start:[2,17], end:[3,7], days:18, km:350, cumulative:800, nectar:'油菜', risk:1, honey:.05, bad:19, nwi:52.70 },
        { id:3, from:'江苏', to:'江苏', start:[4,2], end:[4,22], days:20, km:200, cumulative:1000, nectar:'甘蓝型油菜/紫云英', risk:.6333, honey:.6667, bad:2, nwi:71.90 },
        { id:4, from:'山东', to:'山东', start:[5,2], end:[5,22], days:20, km:400, cumulative:1400, nectar:'刺槐', risk:.9643, honey:.4762, bad:4, nwi:71.19 },
        { id:5, from:'辽宁', to:'辽宁', start:[5,25], end:[6,7], days:13, km:300, cumulative:1700, nectar:'刺槐（二趟）', risk:.9214, honey:.4286, bad:3, nwi:83.21 },
        { id:6, from:'吉林', to:'黑龙江', start:[6,12], end:[7,12], days:30, km:600, cumulative:2300, nectar:'椴树', risk:1, honey:.4194, bad:9, nwi:74.55 },
        { id:7, from:'内蒙古', to:'内蒙古', start:[7,17], end:[8,17], days:31, km:400, cumulative:2700, nectar:'胡枝子/向日葵', risk:.6781, honey:.6875, bad:3, nwi:80.69 },
        { id:8, from:'广东', to:'福建', start:[11,12], end:[11,28], days:16, km:800, cumulative:3500, nectar:'越冬南返', risk:.9216, honey:.5294, bad:4, nwi:73 }
      ];

      const descriptions = {
        chain: ['迁徙风险链', '按迁徙顺序串联节点，突出风险如何沿路线连续累积与传导。', '逐路段解释']
      };

      const riskColor = value => value >= .9 ? '#a85442' : value >= .65 ? '#c47d57' : value >= .35 ? '#d9a06c' : '#8fae8e';
      const formatDate = value => `${value[0]}月${value[1]}日`;
      const detail = segment => `第 ${segment.id} 段 · ${segment.from} → ${segment.to}\n${formatDate(segment.start)}—${formatDate(segment.end)} · ${segment.km} km\n蜜源：${segment.nectar}\n风险指数：${segment.risk.toFixed(4)}\n有效采蜜率：${(segment.honey*100).toFixed(1)}%\n最长恶劣天气：${segment.bad} 天\n平均 NWI：${segment.nwi.toFixed(2)}`;
      const routeLabel = segment => segment.from === segment.to ? `${segment.to}${segment.to === '内蒙古' ? '区内' : '省内'}` : `${segment.from}→${segment.to}`;
      const heading = scheme => `<header class="scheme-heading"><div class="scheme-heading-row"><h3>${descriptions[scheme][0]}</h3><span class="scheme-badge">${descriptions[scheme][2]}</span></div><p>${descriptions[scheme][1]}</p></header>`;
      const currentRouteFocus = () => `<section class="current-route-focus"><header class="current-route-heading"><h3>当前路线风险解释</h3><p>东线（沿海线）　·　2020s</p></header><div class="current-route-kpis"><span>路段<strong>8</strong></span><span>里程<strong>3,500 km</strong></span><span>平均采蜜率<strong>51%</strong></span><span>平均风险<strong>0.76</strong></span></div><p class="current-route-reading">天气窗口偏紧，风险主要来自连续低 NWI 或降水中断。大转地最新可比单箱利润约 329 元/箱；所选路线共匹配 5 个省域授粉案例，可作为补充收入场景。逐日天气与路段停留窗口匹配较完整。</p></section>`;

      function renderChain() {
        return `${currentRouteFocus()}${heading('chain')}<div class="risk-chain-legend" aria-label="迁徙风险链图例"><span><i class="value-key">0.76</i>圆内数值：风险指数</span><span><i class="color-key"></i>颜色：低风险 → 高风险</span></div><div class="risk-chain"><svg class="risk-chain-arrows" viewBox="0 0 400 159" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="chain-arrowhead" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d6d0c7"></path></marker></defs><path class="risk-chain-arrow" d="M66 18 H134" marker-end="url(#chain-arrowhead)"></path><path class="risk-chain-arrow" d="M166 18 H234" marker-end="url(#chain-arrowhead)"></path><path class="risk-chain-arrow" d="M266 18 H334" marker-end="url(#chain-arrowhead)"></path><path class="risk-chain-arrow" d="M350 27 V95" marker-end="url(#chain-arrowhead)"></path><path class="risk-chain-arrow" d="M334 104 H266" marker-end="url(#chain-arrowhead)"></path><path class="risk-chain-arrow" d="M234 104 H166" marker-end="url(#chain-arrowhead)"></path><path class="risk-chain-arrow" d="M134 104 H66" marker-end="url(#chain-arrowhead)"></path></svg>${segments.map(segment => `<div class="chain-node" data-segment="${segment.id}" data-route-label="${routeLabel(segment)}" data-tip="${detail(segment)}"><span class="chain-dot" style="background:${riskColor(segment.risk)}">${segment.risk.toFixed(2)}</span><strong data-segment-label>${segment.to}</strong><small>${segment.nectar}</small></div>`).join('')}</div><div class="chain-insight"><span>安徽段采蜜率仅 5%，风险骤升至 1.00</span><span>山东至黑龙江形成连续高风险链</span><span>内蒙古短暂缓和，南返段再次升高</span></div>`;
      }
      const stage = document.querySelector('[data-scheme-stage]');
      stage.innerHTML = `<section class="scheme-panel">${renderChain()}</section>`;
      const tooltip = document.querySelector('[data-tooltip]');
      stage.addEventListener('pointerover', event => {
        const item = event.target.closest('[data-segment]');
        if (item) {
          stage.classList.add('has-focus');
          stage.querySelectorAll(`[data-segment="${item.dataset.segment}"]`).forEach(node => node.classList.add('is-focus'));
          const label = item.querySelector('[data-segment-label]');
          if (label) label.textContent = item.dataset.routeLabel;
        }
        const tip = event.target.closest('[data-tip]');
        if (tip) { tooltip.textContent = tip.dataset.tip; tooltip.hidden = false; }
      });
      stage.addEventListener('pointermove', event => {
        if (tooltip.hidden) return;
        tooltip.style.left = `${Math.min(innerWidth-tooltip.offsetWidth-12,event.clientX+12)}px`;
        tooltip.style.top = `${Math.min(innerHeight-tooltip.offsetHeight-12,event.clientY+12)}px`;
      });
      stage.addEventListener('pointerout', event => {
        const item = event.target.closest('[data-segment]');
        if (item && !item.contains(event.relatedTarget)) {
          stage.querySelectorAll('.is-focus').forEach(node => node.classList.remove('is-focus'));
          stage.classList.remove('has-focus');
          const label = item.querySelector('[data-segment-label]');
          const segment = segments.find(value => String(value.id) === item.dataset.segment);
          if (label && segment) label.textContent = segment.to;
        }
        if (event.target.closest('[data-tip]')) tooltip.hidden = true;
      });
    </script>
  </body>
</html>
